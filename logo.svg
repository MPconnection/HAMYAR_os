<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="همیار زندگی" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6DE9C"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C6F16"/>
    </linearGradient>
    <linearGradient id="goldGlyph" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8E7B0"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241C11"/>
      <stop offset="100%" stop-color="#120D07"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F6DE9C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F6DE9C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer gold badge -->
  <rect x="6" y="6" width="244" height="244" rx="64" fill="url(#goldEdge)"/>

  <!-- inner dark plate -->
  <rect x="18" y="18" width="220" height="220" rx="54" fill="url(#plate)"/>
  <rect x="18" y="18" width="220" height="220" rx="54" fill="url(#glow)"/>
  <rect x="18.75" y="18.75" width="218.5" height="218.5" rx="53.5" fill="none" stroke="url(#goldEdge)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- monogram: stylized "ه" (first letter of "همیار") -->
  <text x="128" y="167" text-anchor="middle"
        font-family="Vazirmatn, 'Segoe UI', sans-serif" font-weight="800"
        font-size="128" fill="url(#goldGlyph)">ه</text>

  <!-- heart accent, bottom-right: the "relationship" half of the story -->
  <g transform="translate(163,163)">
    <circle cx="20" cy="20" r="27" fill="url(#plate)" stroke="url(#goldEdge)" stroke-width="2"/>
    <path d="M20 30.5
             C11 23.7 6 19.2 6 13.8
             C6 9.7 9.2 6.5 13.2 6.5
             C15.9 6.5 18.2 7.9 20 10.8
             C21.8 7.9 24.1 6.5 26.8 6.5
             C30.8 6.5 34 9.7 34 13.8
             C34 19.2 29 23.7 20 30.5 Z"
          fill="#C98A5B"/>
  </g>
</svg>
