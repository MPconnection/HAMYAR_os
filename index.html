        case 'join-invite': {
          const code = qs('#join-code-input').value.trim();
          if (!code) { ToastManager.warning('کد را وارد کن.'); return; }
          await App.withLoading(async () => {
            await RelationshipManager.joinWithCode(code);
            await Promise.all([MemoryManager.loadAll(), ChallengeManager.loadAll(), MoodManager.loadHistory(), CycleManager.loadAll(), DailyMessageManager.loadToday()]);
            RealtimeManager.subscribeToRelationship();
            UIManager.renderView();
            ToastManager.success('به پارتنرت متصل شدی ❤️');
          });
          break;
        }

        case 'upload-avatar': qs('#avatar-input').click(); break;
        case 'save-profile': {
          const name = qs('#settings-name').value.trim();
          await App.withLoading(async () => { await ProfileManager.updateProfile({ full_name: name }); UIManager.renderView(); ToastManager.success('با موفقیت ذخیره شد ✓'); });
          break;
        }
        case 'change-password': {
          const pass = qs('#new-password').value;
          if (!pass || pass.length < 6) { ToastManager.warning('رمز باید حداقل ۶ کاراکتر باشد.'); return; }
          await App.withLoading(async () => { await AuthManager.updatePassword(pass); ToastManager.success('رمز عبور به‌روزرسانی شد ✓'); });
          break;
        }
        case 'toggle-pref': {
          const pref = t.dataset.pref;
          State.localPrefs[pref] = t.checked;
          saveLocalPrefs();
          break;
        }
        case 'set-theme': {
          const theme = t.dataset.value === 'light' ? 'light' : 'dark';
          State.localPrefs.theme = theme;
          saveLocalPrefs();
          document.documentElement.setAttribute('data-theme', theme);
          UIManager.renderView();
          break;
        }
        case 'test-notification': await NotificationManager.sendTest(); break;
        case 'logout':
          confirmModal('از حساب خارج می‌شوی؟', async () => { await AuthManager.signOut(); App.showAuthScreen(); });
          break;

        default: break;
      }
    });

    // Checkbox switch clicks (toggle-pref) come from 'change' on inputs, not click on wrapper
    document.addEventListener('change', async (e) => {
      const input = e.target;
      if (input.matches('[data-action="toggle-pref"]')) {
        const pref = input.dataset.pref;
        if (pref === 'notifications') {
          if (input.checked) {
            const granted = await NotificationManager.requestPermission();
            if (!granted) { input.checked = false; return; }
            NotificationManager.startChecking();
          } else {
            NotificationManager.stopChecking();
          }
        }
        State.localPrefs[pref] = input.checked;
        saveLocalPrefs();
      }
      if (input.id === 'task-sort-select' || input.matches('select[data-action="set-task-sort"]')) {
        State.taskSort = input.value; UIManager.renderView();
      }
      if (input.id === 'avatar-input') {
        const file = input.files[0];
        if (!file) return;
        await App.withLoading(async () => {
          const url = await ProfileManager.uploadAvatar(file);
          await ProfileManager.updateProfile({ avatar_url: url });
          UIManager.renderView();
          ToastManager.success('با موفقیت ذخیره شد ✓');
        });
      }
      if (input.matches('[data-action="toggle-cycle-share"]')) {
        await App.withLoading(async () => {
          await CycleManager.toggleShare(input.dataset.id, input.checked);
          ToastManager.success('تنظیم اشتراک‌گذاری ذخیره شد ✓');
        });
      }
      if (input.name === 'symptoms' && input.closest('.chip')) {
        input.closest('.chip').classList.toggle('active', input.checked);
      }
    });

    // Live label sync for the pain-level slider
    document.addEventListener('input', (e) => {
      if (e.target.id === 'pain-range') {
        const lbl = qs('#pain-val');
        if (lbl) lbl.textContent = Digits.toFa(e.target.value);
      }
    });

    // Text inputs: search boxes
    document.addEventListener('input', (e) => {
      if (e.target.matches('[data-action="task-search"]')) {
        State.taskSearch = e.target.value; UIManager.renderView();
        // preserve focus
        requestAnimationFrame(() => { const el2 = qs('[data-action="task-search"]'); if (el2) { el2.focus(); el2.selectionStart = el2.selectionEnd = el2.value.length; } });
      }
      if (e.target.matches('[data-action="memory-search"]')) {
        State.memorySearch = e.target.value; UIManager.renderView();
        requestAnimationFrame(() => { const el2 = qs('[data-action="memory-search"]'); if (el2) { el2.focus(); el2.selectionStart = el2.selectionEnd = el2.value.length; } });
      }
    });

    // ---------- Form submits inside modals ----------
    document.addEventListener('submit', async (e) => {
      if (e.target.id === 'task-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        const editId = e.target.dataset.editId;
        const payload = {
          title: fd.get('title').trim(),
          description: fd.get('description').trim(),
          due_date: fd.get('due_date') || null,
          due_time: fd.get('due_time') || null,
          priority: fd.get('priority'),
          list_type: fd.get('list_type'),
          tagNames: fd.get('tags').split(',').map((s) => s.trim()).filter(Boolean),
          subtasks: fd.get('subtasks').split('\n').map((s) => s.trim()).filter(Boolean)
        };
        await App.withLoading(async () => {
          if (editId) await TaskManager.updateTask(editId, payload);
          else await TaskManager.createTask(payload);
          ModalManager.close(); UIManager.renderView();
          ToastManager.success('با موفقیت ذخیره شد ✓');
        });
      }

      if (e.target.id === 'goal-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        const editId = e.target.dataset.editId;
        const payload = {
          title: fd.get('title').trim(),
          description: fd.get('description').trim(),
          horizon: fd.get('horizon'),
          start_date: fd.get('start_date') || null,
          deadline: fd.get('deadline') || null,
          steps: fd.get('steps').split('\n').map((s) => s.trim()).filter(Boolean)
        };
        await App.withLoading(async () => {
          if (editId) await GoalManager.updateGoal(editId, payload);
          else await GoalManager.createGoal(payload);
          ModalManager.close(); UIManager.renderView();
          ToastManager.success('با موفقیت ذخیره شد ✓');
        });
      }

      if (e.target.id === 'memory-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        const file = fd.get('image');
        await App.withLoading(async () => {
          await MemoryManager.create({
            title: fd.get('title').trim(),
            memory_date: fd.get('memory_date') || JalaliUtil.dateToIso(new Date()),
            description: fd.get('description').trim(),
            location: fd.get('location').trim() || null
          }, file && file.size ? file : null);
          ModalManager.close(); UIManager.renderView();
          ToastManager.success('با موفقیت ذخیره شد ✓');
        });
      }

      if (e.target.id === 'challenge-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        await App.withLoading(async () => {
          await ChallengeManager.create({
            title: fd.get('title').trim(),
            description: fd.get('description').trim(),
            target: Number(fd.get('target')) || 1,
            start_date: JalaliUtil.dateToIso(new Date()),
            end_date: fd.get('end_date') || null
          });
          ModalManager.close(); UIManager.renderView();
          ToastManager.success('با موفقیت ذخیره شد ✓');
        });
      }

      if (e.target.id === 'cycle-start-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        await App.withLoading(async () => {
          await CycleManager.startNewPeriod(fd.get('start_date'), fd.get('is_shared') === 'on');
          ModalManager.close(); UIManager.renderView();
          ToastManager.success('چرخه‌ات ثبت شد ✓');
        });
      }

      if (e.target.id === 'cycle-edit-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        const cid = e.target.dataset.id;
        await App.withLoading(async () => {
          await CycleManager.correctCycle(cid, { start_date: fd.get('start_date'), end_date: fd.get('end_date') || null });
          ModalManager.close();
          UIManager.openCycleModal();
          ToastManager.success('تاریخ اصلاح و چرخه دوباره محاسبه شد ✓');
        });
      }

      if (e.target.id === 'cycle-log-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        await App.withLoading(async () => {
          await CycleManager.saveTodayLog({
            symptoms: fd.getAll('symptoms'),
            pain_level: Number(fd.get('pain_level')) || 0,
            energy_level: Number(fd.get('energy_level')) || null,
            mood_today: Number(fd.get('mood_today')) || null,
            note: (fd.get('note') || '').trim()
          });
          ModalManager.close();
          UIManager.openCycleModal();
          ToastManager.success('وضعیت امروز ذخیره شد ✓');
        });
      }

      if (e.target.id === 'daily-message-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        const content = (fd.get('content') || '').trim();
        if (!content) return;
        await App.withLoading(async () => {
          await DailyMessageManager.send(content);
          UIManager.renderView();
          const list = qs('#daily-messages-list');
          if (list) list.scrollTop = list.scrollHeight;
        });
      }
    });
  },

  async init() {
    this.bindEvents();
    if (window.lucide) lucide.createIcons();
    await AuthManager.init();
    if (window.lucide) lucide.createIcons();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }
};

async function TaskOrGoalStepToggle(stepId, goalId) {
  await App.withLoading(async () => { await GoalManager.toggleStep(stepId, goalId); UIManager.renderView(); });
}

document.addEventListener('DOMContentLoaded', () => App.init());

</script>
</body>
</html>
