<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>همیار زندگی</title>
<meta name="description" content="مدیریت شخصی زندگی، کارها، اهداف و رابطه" />
<meta name="theme-color" content="#0A0806" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/svg+xml" href="./logo.svg" />
<link rel="apple-touch-icon" href="./logo.svg" />
<script>
  (function () {
    try {
      var prefs = JSON.parse(localStorage.getItem('hamyar_prefs') || '{}');
      if (prefs.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  /* ============================================================
     DESIGN TOKENS
  ============================================================ */
  :root{
    --bg-base:#0A0806;
    --bg-elevated:#151009;
    --surface:#1C160D;
    --surface-2:#251D12;
    --surface-hover:#2E2416;
    --border:#3A2E19;
    --border-soft:#241C11;

    --accent:#D4AF37;
    --accent-2:#F1CD6E;
    --accent-soft:rgba(212,175,55,0.16);

    --rose:#C98A5B;
    --rose-2:#E8B989;
    --rose-soft:rgba(201,138,91,0.18);

    --text-primary:#F5EEDC;
    --text-secondary:#B7AC90;
    --text-muted:#8B8067;

    --success:#4CB27E;
    --success-soft:rgba(76,178,126,0.16);
    --warning:#E0A83A;
    --warning-soft:rgba(224,168,58,0.16);
    --danger:#E0685A;
    --danger-soft:rgba(224,104,90,0.16);

    --glow-1:rgba(212,175,55,0.12);
    --glow-2:rgba(201,138,91,0.08);

    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:22px;
    --radius-full:999px;

    --shadow-card:0 1px 0 rgba(255,224,158,0.04) inset, 0 8px 24px -12px rgba(0,0,0,0.6);
    --shadow-pop:0 20px 60px -20px rgba(0,0,0,0.75);

    --nav-h:64px;
    --header-h:56px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }

  [data-theme="light"]{
    --bg-base:#FAF6EC;
    --bg-elevated:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F3ECDA;
    --surface-hover:#ECE0C4;
    --border:#E4D7B6;
    --border-soft:#EFE6D0;

    --accent:#B8860B;
    --accent-2:#D4AF37;
    --accent-soft:rgba(184,134,11,0.14);

    --rose:#B5714E;
    --rose-2:#D9A579;
    --rose-soft:rgba(181,113,78,0.14);

    --text-primary:#2B2417;
    --text-secondary:#6B6048;
    --text-muted:#978C6C;

    --success:#2F9E64;
    --success-soft:rgba(47,158,100,0.12);
    --warning:#C98A1B;
    --warning-soft:rgba(201,138,27,0.12);
    --danger:#C24B3F;
    --danger-soft:rgba(194,75,63,0.12);

    --glow-1:rgba(184,134,11,0.10);
    --glow-2:rgba(181,113,78,0.08);

    --shadow-card:0 1px 0 rgba(255,255,255,0.7) inset, 0 8px 20px -14px rgba(120,90,30,0.22);
    --shadow-pop:0 20px 50px -20px rgba(120,90,30,0.3);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 85% -10%, var(--glow-1), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, var(--glow-2), transparent 55%),
      var(--bg-base);
    color:var(--text-primary);
    font-family:'Vazirmatn', system-ui, sans-serif;
    direction:rtl;
    transition:background-color .25s ease, color .25s ease;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button, input, textarea, select{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--accent-soft); }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--surface-2); border-radius:99px; }

  :focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px; border-radius:6px; }

  h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:-0.01em; }
  p{ margin:0; }

  .num{ font-variant-numeric:tabular-nums; }

  /* ============================================================
     LAYOUT SHELLS
  ============================================================ */
  #app-root{ min-height:100%; display:none; }
  #app-root.ready{ display:block; }

  .app-shell{
    display:flex;
    min-height:100vh;
  }

  .desktop-sidebar{ display:none; }

  .main-col{
    flex:1;
    min-width:0;
    padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px);
  }

  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:linear-gradient(to bottom, var(--bg-base), transparent);
    backdrop-filter:blur(14px);
  }
  .topbar::after{
    content:''; position:absolute; right:0; left:0; bottom:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:.45;
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; }
  .topbar .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); }
  .topbar .icon-btn{ }

  .view-container{ padding:6px 18px 18px; max-width:920px; margin:0 auto; width:100%; }

  .bottom-nav{
    position:fixed; right:0; left:0; bottom:0; z-index:30;
    height:calc(var(--nav-h) + var(--safe-b));
    padding-bottom:var(--safe-b);
    display:flex;
    background:rgba(16,19,29,0.88);
    backdrop-filter:blur(18px);
    border-top:1px solid var(--border-soft);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    font-size:11px; font-weight:500; padding:6px 0 2px;
    transition:color .15s ease;
  }
  .nav-item svg{ width:21px; height:21px; stroke-width:2; transition:transform .15s ease; }
  .nav-item.active{ color:var(--accent-2); }
  .nav-item.active svg{ transform:translateY(-1px); }

  /* ============================================================
     CARDS / PRIMITIVES
  ============================================================ */
  .card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:18px;
  }
  .card + .card{ margin-top:14px; }
  .section-gap{ margin-top:18px; }

  .row{ display:flex; align-items:center; }
  .between{ justify-content:space-between; }
  .gap-8{ gap:8px; } .gap-10{ gap:10px; } .gap-12{ gap:12px; } .gap-16{ gap:16px; }
  .muted{ color:var(--text-secondary); }
  .faint{ color:var(--text-muted); }
  .small{ font-size:12.5px; }
  .tiny{ font-size:11px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; cursor:pointer; border-radius:var(--radius-md);
    padding:12px 18px; font-weight:600; font-size:14px;
    transition:transform .12s ease, opacity .12s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; }
  .btn-rose{ background:linear-gradient(135deg, var(--rose), var(--rose-2)); color:#fff; }
  .btn-ghost{ background:var(--surface-2); color:var(--text-primary); }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text-primary); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 14px; font-size:13px; border-radius:var(--radius-sm); }
  .btn-icon{ width:38px; height:38px; padding:0; border-radius:var(--radius-md); background:var(--surface-2); color:var(--text-primary); }
  .btn[disabled]{ opacity:.55; pointer-events:none; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:7px; font-weight:600; }
  .input, textarea.input, select.input{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-primary); border-radius:var(--radius-sm); padding:12px 14px;
    font-size:14px; outline:none; transition:border-color .15s ease;
  }
  .input:focus{ border-color:var(--accent-2); }
  textarea.input{ resize:vertical; min-height:80px; }
  .input-row{ display:flex; gap:10px; }
  .input-row > *{ flex:1; }

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:var(--radius-full);
    font-size:11.5px; font-weight:600;
  }
  .badge-urgent{ background:var(--danger-soft); color:var(--danger); }
  .badge-important{ background:var(--warning-soft); color:var(--warning); }
  .badge-normal{ background:var(--surface-2); color:var(--text-secondary); }
  .badge-success{ background:var(--success-soft); color:var(--success); }
  .badge-accent{ background:var(--accent-soft); color:var(--accent-2); }
  .badge-rose{ background:var(--rose-soft); color:var(--rose-2); }

  .progress-track{ height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; }
  .progress-fill.rose{ background:linear-gradient(90deg,var(--rose),var(--rose-2)); }

  .divider{ height:1px; background:var(--border-soft); border:none; margin:14px 0; }

  .empty-state{ text-align:center; padding:36px 14px; color:var(--text-muted); }
  .empty-state .emoji{ font-size:34px; display:block; margin-bottom:10px; }

  .skeleton{ position:relative; overflow:hidden; background:var(--surface-2); border-radius:var(--radius-sm); }
  .skeleton::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    animation:shimmer 1.3s infinite;
  }
  @keyframes shimmer{ from{ transform:translateX(-100%);} to{ transform:translateX(100%);} }

  .checkbox{
    width:22px; height:22px; border-radius:7px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer;
    background:var(--surface-2); transition:all .15s ease;
  }
  .checkbox.checked{ background:var(--success); border-color:var(--success); }
  .checkbox svg{ width:14px; height:14px; color:#0A0C13; opacity:0; transform:scale(.6); transition:all .15s ease; }
  .checkbox.checked svg{ opacity:1; transform:scale(1); }

  /* Fade/slide transitions */
  .view-enter{ animation:viewIn .22s ease both; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  /* ============================================================
     AUTH SCREEN
  ============================================================ */
  #auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-box{ width:100%; max-width:380px; }
  .auth-logo{ text-align:center; margin-bottom:28px; }
  .auth-logo .mark{
    width:72px; height:72px; border-radius:22px; margin:0 auto 14px;
    box-shadow:0 14px 34px -12px rgba(212,175,55,0.55);
  }
  .auth-logo .mark svg{ width:100%; height:100%; display:block; }
  .auth-tabs{ display:flex; background:var(--surface); border-radius:var(--radius-md); padding:4px; margin-bottom:20px; border:1px solid var(--border-soft); }
  .auth-tab{ flex:1; text-align:center; padding:10px; border-radius:var(--radius-sm); font-weight:600; font-size:13.5px; color:var(--text-muted); cursor:pointer; background:none; border:none; }
  .auth-tab.active{ background:var(--surface-2); color:var(--text-primary); }
  .auth-error{ background:var(--danger-soft); color:var(--danger); border-radius:var(--radius-sm); padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .auth-link{ text-align:center; margin-top:14px; font-size:13px; color:var(--text-muted); cursor:pointer; }
  .auth-link span{ color:var(--accent-2); font-weight:600; }

  /* ============================================================
     TOAST
  ============================================================ */
  #toast-stack{
    position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:0; right:0; z-index:200;
    display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 16px;
  }
  .toast{
    pointer-events:auto;
    display:flex; align-items:center; gap:10px;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-primary); padding:12px 16px; border-radius:var(--radius-md);
    font-size:13.5px; font-weight:600; box-shadow:var(--shadow-pop);
    animation:toastIn .25s ease both; max-width:420px;
  }
  .toast.success{ border-color:rgba(52,211,153,0.35); }
  .toast.error{ border-color:rgba(240,99,124,0.4); }
  .toast.warning{ border-color:rgba(245,184,78,0.4); }
  .toast .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .toast.success .dot{ background:var(--success); }
  .toast.error .dot{ background:var(--danger); }
  .toast.warning .dot{ background:var(--warning); }
  .toast.info .dot{ background:var(--accent-2); }
  @keyframes toastIn{ from{opacity:0; transform:translateY(-10px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes toastOut{ to{opacity:0; transform:translateY(-10px) scale(.96);} }

  /* ============================================================
     MODAL
  ============================================================ */
  #modal-layer{ position:fixed; inset:0; z-index:150; display:none; }
  #modal-layer.open{ display:block; }
  .modal-backdrop{ position:absolute; inset:0; background:rgba(6,7,12,0.65); backdrop-filter:blur(3px); animation:fadeIn .18s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-sheet{
    position:absolute; right:0; left:0; bottom:0; max-height:88vh; overflow-y:auto;
    background:var(--bg-elevated); border-radius:22px 22px 0 0; padding:18px 18px calc(24px + var(--safe-b));
    animation:sheetIn .25s cubic-bezier(.2,.8,.3,1) both; border-top:1px solid var(--border-soft);
  }
  @keyframes sheetIn{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
  .modal-handle{ width:38px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 14px; }
  .modal-title{ font-size:17px; font-weight:800; margin-bottom:16px; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }

  @media (min-width:720px){
    .modal-sheet{
      position:relative; margin:8vh auto; max-width:480px; border-radius:22px;
      animation:popIn .2s ease both;
    }
    @keyframes popIn{ from{opacity:0; transform:scale(.96) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);} }
    .modal-backdrop ~ .modal-sheet{}
  }

  /* ============================================================
     TODAY VIEW
  ============================================================ */
  .greeting{ font-size:19px; font-weight:800; margin-bottom:2px; }
  .date-line{ color:var(--text-muted); font-size:13px; }

  .stat-ring{ position:relative; width:64px; height:64px; flex:none; }
  .stat-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .stat-ring .ring-bg{ fill:none; stroke:var(--surface-2); stroke-width:6; }
  .stat-ring .ring-fill{ fill:none; stroke:url(#ringGrad); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .5s ease; }
  .stat-ring .ring-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; }

  .quick-actions{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .qa-btn{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
    padding:14px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; color:var(--text-primary);
  }
  .qa-btn span{ font-size:10.5px; font-weight:600; color:var(--text-secondary); }
  .qa-btn .emoji{ font-size:19px; }

  .task-mini{ display:flex; align-items:center; gap:12px; padding:10px 0; }
  .task-mini + .task-mini{ border-top:1px solid var(--border-soft); }
  .task-mini .title{ font-size:14px; font-weight:600; }
  .task-mini .title.done{ text-decoration:line-through; color:var(--text-muted); }
  .task-mini .meta{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }

  .streak-flame{ font-size:22px; }

  /* ============================================================
     DESKTOP GRID
  ============================================================ */
  @media (min-width:900px){
    .app-shell{ max-width:1180px; margin:0 auto; }
    .desktop-sidebar{
      display:flex; flex-direction:column; width:236px; flex:none; padding:22px 16px;
      border-left:1px solid var(--border-soft); gap:6px; position:sticky; top:0; height:100vh;
    }
    .bottom-nav{ display:none; }
    .main-col{ padding-bottom:32px; }
    .view-container{ max-width:none; padding:22px 28px; }
    .sb-brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; padding:8px 10px 22px; }
    .sb-item{
      display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:var(--radius-md);
      color:var(--text-muted); font-weight:600; font-size:14px; cursor:pointer; background:none; border:none; text-align:right;
    }
    .sb-item svg{ width:19px; height:19px; }
    .sb-item.active{ background:var(--accent-soft); color:var(--accent-2); }
    .today-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; }
    .today-grid .card{ margin-top:0 !important; }
    .col-stack{ display:flex; flex-direction:column; gap:16px; }
    .tasks-grid, .goals-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  }

  /* Week calendar */
  .week-strip{ display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; }
  .week-day{
    flex:1; min-width:44px; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 4px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border-soft);
    cursor:pointer; color:var(--text-secondary);
  }
  .week-day.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent; }
  .week-day .wd-name{ font-size:10.5px; }
  .week-day .wd-num{ font-size:14px; font-weight:800; }
  .week-day .wd-dot{ width:5px; height:5px; border-radius:50%; background:var(--rose); }

  /* Filter chips */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .chip{
    flex:none; padding:8px 14px; border-radius:99px; background:var(--surface); border:1px solid var(--border-soft);
    font-size:12.5px; font-weight:600; color:var(--text-secondary); cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background:var(--accent); color:#fff; border-color:transparent; }

  /* Mood face picker */
  .mood-picker{ display:flex; justify-content:space-between; gap:8px; }
  .mood-opt{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 4px;
    border-radius:var(--radius-md); background:var(--surface-2); border:2px solid transparent; cursor:pointer;
    font-size:24px; color:var(--text-muted);
  }
  .mood-opt.selected{ border-color:var(--rose); background:var(--rose-soft); }
  .mood-opt .lbl{ font-size:10px; font-weight:600; }

  /* Memory cards */
  .memory-card{ overflow:hidden; padding:0; }
  .memory-img{ width:100%; height:170px; object-fit:cover; display:block; background:var(--surface-2); }
  .memory-body{ padding:14px 16px; }

  /* Pomodoro */
  .pomo-wrap{ display:flex; flex-direction:column; align-items:center; padding:20px 0 6px; }
  .pomo-ring{ position:relative; width:220px; height:220px; }
  .pomo-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .pomo-time{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .pomo-time .t{ font-size:38px; font-weight:800; font-variant-numeric:tabular-nums; }
  .pomo-time .m{ font-size:12px; color:var(--text-muted); margin-top:4px; }
  .pomo-controls{ display:flex; gap:10px; margin-top:22px; }

  /* Confetti */
  .confetti-piece{
    position:fixed; top:-10px; width:8px; height:14px; z-index:999; pointer-events:none; border-radius:2px;
    animation:confettiFall 1.1s ease-in forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(320px) rotate(340deg); opacity:0; }
  }

  /* Relationship pairing */
  .invite-code-box{
    text-align:center; padding:22px; background:var(--surface-2); border-radius:var(--radius-md);
    font-size:28px; font-weight:800; letter-spacing:6px; color:var(--accent-2); font-family:monospace, 'Vazirmatn';
  }

const JalaliUtil = (() => {
  function div(a, b) { return ~~(a / b); }
  function mod(a, b) { return a - ~~(a / b) * b; }

  function jalCal(jy) {
    const breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
    const bl = breaks.length;
    const gy = jy + 621;
    let leapJ = -14, jp = breaks[0], jump = 0;
    if (jy < jp || jy >= breaks[bl - 1]) throw new Error('Invalid Jalaali year ' + jy);
    for (let i = 1; i < bl; i += 1) {
      const jm = breaks[i];
      jump = jm - jp;
      if (jy < jm) break;
      leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
      jp = jm;
    }
    let n = jy - jp;
    leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    const march = 20 + leapJ - leapG;
    if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
    let leap = mod(mod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;
    return { leap, gy, march };
  }

  function g2d(gy, gm, gd) {
    let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4)
      + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
    d = d - div(div(gy + div(gm - 8, 6) + 100100, 100) * 3, 4) + 752;
    return d;
  }
  function d2g(jdn) {
    let j = 4 * jdn + 139361631;
    j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = div(mod(j, 1461), 4) * 5 + 308;
    const gd = div(mod(i, 153), 5) + 1;
    const gm = mod(div(i, 153), 12) + 1;
    const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
    return { gy, gm, gd };
  }
  function j2d(jy, jm, jd) {
    const r = jalCal(jy);
    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
  }
  function d2j(jdn) {
    const gy = d2g(jdn).gy;
    let jy = gy - 621;
    const r = jalCal(jy);
    const jdn1f = g2d(gy, 3, r.march);
    let k = jdn - jdn1f;
    if (k >= 0) {
      if (k <= 185) return { jy, jm: 1 + div(k, 31), jd: mod(k, 31) + 1 };
      k -= 186;
    } else {

      k += 179;
      if (r.leap === 1) k += 1;
    }
    return { jy, jm: 7 + div(k, 30), jd: mod(k, 30) + 1 };
  }

  function toJalali(gy, gm, gd) { return d2j(g2d(gy, gm, gd)); }
  function toGregorian(jy, jm, jd) { return d2g(j2d(jy, jm, jd)); }

  function fromDate(date) {
    return toJalali(date.getFullYear(), date.getMonth() + 1, date.getDate());
  }
  function toDate(jy, jm, jd) {
    const g = toGregorian(jy, jm, jd);
    return new Date(g.gy, g.gm - 1, g.gd);
  }

  const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const WEEKDAYS = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
  const WEEKDAYS_SHORT = ['ی','د','س','چ','پ','ج','ش'];

  function formatFull(date) {
    const j = fromDate(date);
    const wd = WEEKDAYS[date.getDay()];
    return `${wd} ${Digits.toFa(j.jd)} ${MONTHS[j.jm - 1]} ${Digits.toFa(j.jy)}`;
  }
  function formatShort(date) {
    const j = fromDate(date);
    return `${Digits.toFa(j.jd)} ${MONTHS[j.jm - 1]}`;
  }
  function isoToDate(iso) {
    if (!iso) return null;
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function dateToIso(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  return { toJalali, toGregorian, fromDate, toDate, formatFull, formatShort, isoToDate, dateToIso, MONTHS, WEEKDAYS, WEEKDAYS_SHORT };
})();

const Digits = {
  faMap: ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'],
  toFa(input) {
    return String(input).replace(/[0-9]/g, (d) => this.faMap[Number(d)]);

};

  const msg = err.message || String(err);

/* ================================================================
   NOTIFICATION MANAGER — یادآوری‌های محلی و رایگان (بدون سرور)
   نکته: این روش فقط وقتی کار می‌کند که برنامه باز باشد (یا به‌عنوان
   PWA نصب شده و مرورگر/سیستم‌عامل آن را در پس‌زمینه نگه دارد). برای
   اعلان واقعی هنگام بسته‌بودن کامل اپ، به Web Push + یک Trigger روی
   سرور نیاز است که پیچیدگی و نقطه خرابی بیشتری دارد.
================================================================ */
const NotificationManager = {
  checkTimer: null,

  isSupported() { return 'Notification' in window; },

  hasPermission() { return this.isSupported() && Notification.permission === 'granted'; },

  async requestPermission() {
    if (!this.isSupported()) {
      ToastManager.error('مرورگر شما از اعلان پشتیبانی نمی‌کند.');
      return false;
    }
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') {
      ToastManager.error('اعلان‌ها قبلاً از تنظیمات مرورگر مسدود شده‌اند. برای فعال‌سازی باید از تنظیمات سایت در مرورگر، اجازه اعلان را دوباره بدهید.');
      return false;
    }
    try {
      const result = await Notification.requestPermission();
      if (result !== 'granted') {
        ToastManager.warning('اجازه نمایش اعلان داده نشد.');
        return false;
      }
      return true;
    } catch (e) {
      ToastManager.error('فعال‌سازی اعلان با خطا مواجه شد.');
      return false;
    }
  },

  startChecking() {
    if (this.checkTimer || !this.hasPermission()) return;
    this.checkDueTasks();
    this.checkTimer = setInterval(() => this.checkDueTasks(), 60 * 1000);
  },

  stopChecking() {
    if (this.checkTimer) clearInterval(this.checkTimer);
    this.checkTimer = null;
  },

  getNotifiedStore() {
    const today = JalaliUtil.dateToIso(new Date());
    let store;
    try { store = JSON.parse(localStorage.getItem('hamyar_notified') || '{}'); } catch (e) { store = {}; }
    if (store.date !== today || !Array.isArray(store.ids)) store = { date: today, ids: [] };
    return store;
  },

  markNotified(id) {
    const store = this.getNotifiedStore();
    store.ids.push(id);
    localStorage.setItem('hamyar_notified', JSON.stringify(store));
  },

  checkDueTasks() {
    if (!this.hasPermission() || !State.localPrefs.notifications) return;
    const store = this.getNotifiedStore();
    const now = new Date();
    const todayIso = JalaliUtil.dateToIso(now);
    const nowMinutes = now.getHours() * 60 + now.getMinutes();

    State.tasks.forEach((t) => {
      if (t.completed || !t.due_date || t.due_date !== todayIso || !t.due_time) return;
      if (store.ids.includes(t.id)) return;
      const [h, m] = t.due_time.split(':').map(Number);
      const dueMinutes = h * 60 + m;
      if (nowMinutes >= dueMinutes && nowMinutes - dueMinutes <= 5) {
        this.fire('یادآوری تسک ⏰', t.title);
        this.markNotified(t.id);
      }
    });
  },

  async fire(title, body) {
    try {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification(title, { body, icon: './logo.svg', badge: './logo.svg', dir: 'rtl', lang: 'fa' });
        return;
      }
    } catch (e) { /* fall back below */ }
    try { new Notification(title, { body, icon: './logo.svg' }); } catch (e) { /* silent */ }
  },

  async sendTest() {
    const ok = await this.requestPermission();
    if (!ok) return;
    State.localPrefs.notifications = true;
    saveLocalPrefs();
    this.startChecking();
    UIManager.renderView();
    this.fire('همیار زندگی 🤍', 'اعلان‌ها با موفقیت فعال شدند ✓');
    ToastManager.success('اعلان آزمایشی ارسال شد ✓');
  },

  notifyIfEnabled(title, body) {
    if (this.hasPermission() && State.localPrefs.notifications) this.fire(title, body);
  }
};

/* ================================================================
   TASK MANAGER
================================================================ */
const TaskManager = {
  async loadAll() {
    const { data: tasks, error } = await sb.from('tasks')
      .select('*, subtasks(*), task_tags(tag_id, tags(id, name))')
      .eq('user_id', State.user.id)
      .order('created_at', { ascending: false });
    if (error) throw error;
    State.tasks = (tasks || []).map((t) => ({
      ...t,
      subtasks: (t.subtasks || []).sort((a, b) => a.order_index - b.order_index),
      tagNames: (t.task_tags || []).map((tt) => tt.tags?.name).filter(Boolean)
    }));

    const { data: tags } = await sb.from('tags').select('*').eq('user_id', State.user.id).order('name');
    State.tags = tags || [];
    return State.tasks;
  },

  async createTask(payload) {
    const { subtasks = [], tagNames = [], ...taskFields } = payload;
    const { data: task, error } = await sb.from('tasks').insert({
      user_id: State.user.id,
      relationship_id: State.relationship ? State.relationship.id : null,
      ...taskFields
    }).select().single();
    if (error) throw error;

    if (subtasks.length) {
      const rows = subtasks.map((title, i) => ({ task_id: task.id, title, order_index: i }));
      await sb.from('subtasks').insert(rows);
    }
    if (tagNames.length) {
      await this.attachTags(task.id, tagNames);
    }
    await ActivityManager.log('task');
    await this.loadAll();
    return task;
  },

  async updateTask(id, fields) {
    const { subtasks, tagNames, ...taskFields } = fields;
    const { error } = await sb.from('tasks').update(taskFields).eq('id', id);
    if (error) throw error;

    if (subtasks) {
      await sb.from('subtasks').delete().eq('task_id', id);
      if (subtasks.length) {
        const rows = subtasks.map((title, i) => ({ task_id: id, title, order_index: i }));
        await sb.from('subtasks').insert(rows);
      }
    }
    if (tagNames) {
      await sb.from('task_tags').delete().eq('task_id', id);
      if (tagNames.length) await this.attachTags(id, tagNames);
    }
    await this.loadAll();
  },

  async attachTags(taskId, tagNames) {
    for (const name of tagNames) {
      const clean = name.trim().replace(/^#/, '');
      if (!clean) continue;
      let { data: tag } = await sb.from('tags').select('*').eq('user_id', State.user.id).eq('name', clean).maybeSingle();
      if (!tag) {
        const ins = await sb.from('tags').insert({ user_id: State.user.id, name: clean }).select().single();
        tag = ins.data;
      }
      if (tag) await sb.from('task_tags').insert({ task_id: taskId, tag_id: tag.id });
    }
  },

  async deleteTask(id) {
    const { error } = await sb.from('tasks').delete().eq('id', id);
    if (error) throw error;
    State.tasks = State.tasks.filter((t) => t.id !== id);
  },

  async toggleComplete(id) {
    const task = State.tasks.find((t) => t.id === id);
    if (!task) return;
    const newVal = !task.completed;
    const { error } = await sb.from('tasks').update({ completed: newVal }).eq('id', id);
    if (error) throw error;
    task.completed = newVal;
    if (newVal) {
      fireConfetti();
      await ActivityManager.log('task');
    }
  },

  async toggleSubtask(subtaskId, taskId) {
    const task = State.tasks.find((t) => t.id === taskId);
    const sub = task?.subtasks.find((s) => s.id === subtaskId);
    if (!sub) return;
    const newVal = !sub.completed;
    const { error } = await sb.from('subtasks').update({ completed: newVal }).eq('id', subtaskId);
    if (error) throw error;
    sub.completed = newVal;
  },

  subtaskProgress(task) {
    if (!task.subtasks || !task.subtasks.length) return null;
    const done = task.subtasks.filter((s) => s.completed).length;
    return { done, total: task.subtasks.length, pct: Math.round((done / task.subtasks.length) * 100) };
  },

  getFiltered() {
    let list = [...State.tasks];
    const todayIso = JalaliUtil.dateToIso(new Date());

    switch (State.taskFilter) {
      case 'today': list = list.filter((t) => t.due_date === todayIso); break;
      case 'incomplete': list = list.filter((t) => !t.completed); break;
      case 'completed': list = list.filter((t) => t.completed); break;
      case 'urgent': list = list.filter((t) => t.priority === 'urgent'); break;
      case 'important': list = list.filter((t) => t.priority === 'important'); break;
      case 'work': list = list.filter((t) => t.list_type === 'work'); break;
      case 'relationship': list = list.filter((t) => t.list_type === 'relationship'); break;
      default: break;
    }
    if (State.taskTagFilter) {
      list = list.filter((t) => t.tagNames.includes(State.taskTagFilter));
    }
    if (State.taskSearch.trim()) {
      const q = State.taskSearch.trim().toLowerCase();
      list = list.filter((t) => t.title.toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q));
    }

    const priorityRank = { urgent: 0, important: 1, normal: 2 };
    switch (State.taskSort) {
      case 'deadline':
        list.sort((a, b) => (a.due_date || '9999') > (b.due_date || '9999') ? 1 : -1); break;
      case 'priority':
        list.sort((a, b) => priorityRank[a.priority] - priorityRank[b.priority]); break;
      case 'incomplete_first':
        list.sort((a, b) => Number(a.completed) - Number(b.completed)); break;
      default:
        list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    }
    return list;
  },

  todayStats() {
    const todayIso = JalaliUtil.dateToIso(new Date());
    const today = State.tasks.filter((t) => t.due_date === todayIso);
    const done = today.filter((t) => t.completed).length;
    return { total: today.length, done, remaining: today.length - done, pct: today.length ? Math.round((done / today.length) * 100) : 0 };
  }
};

      await sb.from('goal_steps').insert(rows);
    }

  },

  async updateGoal(id, fields) {
    const { steps, ...goalFields } = fields;
    const { error } = await sb.from('goals').update(goalFields).eq('id', id);
    if (error) throw error;
    if (steps) {
      await sb.from('goal_steps').delete().eq('goal_id', id);
      if (steps.length) {
        const rows = steps.map((title, i) => ({ goal_id: id, title, order_index: i }));
        await sb.from('goal_steps').insert(rows);
      }
    }
    await this.loadAll();
  },

  async deleteGoal(id) {
    const { error } = await sb.from('goals').delete().eq('id', id);
    if (error) throw error;
    State.goals = State.goals.filter((g) => g.id !== id);
  },

  async toggleStep(stepId, goalId) {
    const goal = State.goals.find((g) => g.id === goalId);
    const step = goal?.goal_steps.find((s) => s.id === stepId);
    if (!step) return;
    const newVal = !step.completed;
    const { error } = await sb.from('goal_steps').update({ completed: newVal }).eq('id', stepId);
    if (error) throw error;
    step.completed = newVal;
    await ActivityManager.log('goal');
  },

  progress(goal) {
    if (!goal.goal_steps || !goal.goal_steps.length) return { done: 0, total: 0, pct: 0 };
    const done = goal.goal_steps.filter((s) => s.completed).length;
    return { done, total: goal.goal_steps.length, pct: Math.round((done / goal.goal_steps.length) * 100) };
  },

  deadlineInfo(goal) {
    if (!goal.deadline) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const dl = JalaliUtil.isoToDate(goal.deadline);
    const diffDays = Math.round((dl - today) / 86400000);
    if (diffDays < 0) return { label: 'گذشته', tone: 'danger', icon: '🔴' };
    if (diffDays <= 5) return { label: `${Digits.toFa(diffDays)} روز باقی مانده`, tone: 'warning', icon: '⚠️' };
    return { label: `${Digits.toFa(diffDays)} روز باقی مانده`, tone: 'success', icon: '🟢' };
  },

  getFiltered() {
    if (State.goalHorizonFilter === 'all') return State.goals;
    return State.goals.filter((g) => g.horizon === State.goalHorizonFilter);
  }
};

const CYCLE_DISCLAIMER = 'این اطلاعات برای پیگیری و آموزش سلامت ارائه می‌شود و جایگزین تشخیص یا مشاوره پزشک نیست. زمان تخمک‌گذاری و تاریخ‌های پیش‌بینی‌شده تقریبی هستند و ممکن است بین چرخه‌ها تغییر کنند.';
const CYCLE_DISCLAIMER_SHORT = 'این محاسبات تقریبی هستند و جایگزین مشاوره پزشکی نیستند.';

function addDaysIso(iso, n) {
  const d = JalaliUtil.isoToDate(iso); d.setDate(d.getDate() + n);
  return JalaliUtil.dateToIso(d);
}
function jalaliMonthLength(jy, jm) {
  const nextJy = jm === 12 ? jy + 1 : jy;
  const nextJm = jm === 12 ? 1 : jm + 1;
  const g1 = JalaliUtil.toGregorian(jy, jm, 1);
  const g2 = JalaliUtil.toGregorian(nextJy, nextJm, 1);
  const d1 = new Date(g1.gy, g1.gm - 1, g1.gd);
  const d2 = new Date(g2.gy, g2.gm - 1, g2.gd);
  return Math.round((d2 - d1) / 86400000);
}

/* ================================================================
   CYCLE ALGORITHMS — منطق محض محاسبه چرخه قاعدگی (بدون تماس شبکه‌ای)
   هیچ عدد یا تاریخی Hard Code نشده؛ همه از چرخه‌های واقعی ثبت‌شده
   توسط کاربر محاسبه می‌شود. تاریخ واقعی همیشه بر پیش‌بینی اولویت دارد.
================================================================ */
const CycleAlgorithms = {
  DEFAULT_CYCLE_LEN: 28,
  DEFAULT_PERIOD_LEN: 6,

  diffDays(isoA, isoB) {
    return Math.round((JalaliUtil.isoToDate(isoB) - JalaliUtil.isoToDate(isoA)) / 86400000);
  },

  sortByStart(cycles) {
    return [...cycles].sort((a, b) => (a.start_date < b.start_date ? -1 : a.start_date > b.start_date ? 1 : 0));
  },

  // بعد از هر ثبت/اصلاح/حذف چرخه صدا زده می‌شود تا cycle_length و
  // period_length همه چرخه‌ها بر اساس تاریخ‌های واقعی از نو محاسبه شود.
  recalculateAll(cyclesInput) {
    const cycles = this.sortByStart(cyclesInput).map((c) => ({ ...c }));
    for (let i = 0; i < cycles.length; i += 1) {
      const cur = cycles[i];
      const next = cycles[i + 1];
      cur.cycle_length = next ? this.diffDays(cur.start_date, next.start_date) : null;
      cur.period_length = cur.end_date ? this.diffDays(cur.start_date, cur.end_date) + 1 : (cur.period_length || null);
    }
    return cycles;
  },

  getCurrent(cycles) {
    const sorted = this.sortByStart(cycles);
    return sorted.length ? sorted[sorted.length - 1] : null;
  },

  getStats(cycles, maxCount = 6) {
    const closed = this.sortByStart(cycles).filter((c) => c.cycle_length).slice(-maxCount);
    if (!closed.length) return { count: 0 };
    const lengths = closed.map((c) => c.cycle_length);
    const avg = Math.round(lengths.reduce((a, b) => a + b, 0) / lengths.length);
    const min = Math.min(...lengths);
    const max = Math.max(...lengths);
    const periodLens = closed.filter((c) => c.period_length).map((c) => c.period_length);
    const periodAvg = periodLens.length ? Math.round(periodLens.reduce((a, b) => a + b, 0) / periodLens.length) : null;
    return { count: closed.length, avg, min, max, periodAvg, variability: max - min, irregular: (max - min) > 7 };
  },

  effectiveCycleLength(cycles, manualFallback) {
    const stats = this.getStats(cycles);
    return stats.count >= 2 ? stats.avg : (manualFallback || this.DEFAULT_CYCLE_LEN);
  },

  effectivePeriodLength(cycles, manualFallback) {
    const stats = this.getStats(cycles);
    return stats.periodAvg || manualFallback || this.DEFAULT_PERIOD_LEN;
  },

  getPhase(dayInCycle, cycleLen, periodLen) {
    const ovulationDay = cycleLen - 14;
    if (dayInCycle <= periodLen) return 'period';
    if (dayInCycle < ovulationDay - 1) return 'follicular';
    if (dayInCycle <= ovulationDay + 1) return 'ovulation';
    return 'luteal';
  },

  PHASE_META: {
    period: {
      label: 'قاعدگی', emoji: '🩸', color: '#E0685A',
      description: 'بدن در حال دفع پوشش داخلی رحم است.',
      symptoms: 'خونریزی، گرفتگی، خستگی و تغییرات خلقی از علائم شایع این روزهاست.'
    },
    follicular: {
      label: 'فولیکولی', emoji: '🌱', color: '#4CB27E',
      description: 'سطح استروژن به‌تدریج بالا می‌رود و بدن برای تخمک‌گذاری آماده می‌شود.',
      symptoms: 'معمولاً انرژی و خلق در این بازه بهتر است.'
    },
    ovulation: {
      label: 'تخمک‌گذاری', emoji: '🥚', color: '#D4AF37',
      description: 'احتمالاً نزدیک زمان تخمک‌گذاری هستی — این تاریخ قطعی نیست و بین چرخه‌ها جابه‌جا می‌شود.',
      symptoms: 'برخی افراد در این بازه کمی درد یک‌طرفه لگن یا افزایش ترشحات را تجربه می‌کنند.'
    },
    luteal: {
      label: 'لوتئال', emoji: '🌙', color: '#B8860B',
      description: 'پس از تخمک‌گذاری تا شروع پریود بعدی؛ سطح پروژسترون بالا می‌رود.',
      symptoms: 'نفخ، حساسیت سینه، تغییر خلق و خستگی (PMS) از علائم شایع این مرحله‌اند.'
    }
  },

  getNextPeriodEstimate(startDateIso, cycleLen) {
    return addDaysIso(startDateIso, cycleLen);
  },

  getOvulationEstimate(nextPeriodIso, cycleLen) {
    const center = addDaysIso(nextPeriodIso, -14);
    return { start: addDaysIso(center, -2), end: addDaysIso(center, 2) };
  },

  deviationLabel(length, avg) {
    if (!avg) return null;
    const diff = length - avg;
    if (Math.abs(diff) <= 1) return { label: 'معمول', tone: 'success' };
    return { label: diff < 0 ? 'کوتاه‌تر' : 'طولانی‌تر', tone: 'warning' };
  },

  // خروجی کامل وضعیت امروز برای چرخه در حال جریان
  getStatus(currentCycle, cycles) {
    if (!currentCycle) return null;
    const cycleLen = this.effectiveCycleLength(cycles, currentCycle.cycle_length);
    const periodLen = this.effectivePeriodLength(cycles, currentCycle.period_length);
    const todayIso = JalaliUtil.dateToIso(new Date());
    const rawDay = this.diffDays(currentCycle.start_date, todayIso) + 1;
    const dayInCycle = Math.max(rawDay, 1);
    const isLate = dayInCycle > cycleLen;
    const effectiveDay = isLate ? cycleLen : dayInCycle;
    const phase = this.getPhase(effectiveDay, cycleLen, periodLen);
    const meta = this.PHASE_META[phase];

    const nextPeriodDate = this.getNextPeriodEstimate(currentCycle.start_date, cycleLen);
    const ovulation = this.getOvulationEstimate(nextPeriodDate, cycleLen);
    const daysUntilNextPeriod = this.diffDays(todayIso, nextPeriodDate);
    const stats = this.getStats(cycles);

    return {
      dayInCycle, effectiveDay, phase, meta, cycleLen, periodLen, isLate,
      nextPeriodDate, daysUntilNextPeriod,
      ovulationStart: ovulation.start, ovulationEnd: ovulation.end,
      stats
    };
  }
};

/* ================================================================
   CYCLE MANAGER — تاریخچه واقعی چرخه‌ها (نه یک تنظیم ثابت)
================================================================ */
const CycleManager = {
  async loadAll() {
    const { data, error } = await sb.from('cycles').select('*').eq('user_id', State.user.id).order('start_date', { ascending: true });
    if (error) throw error;
    State.cycles = data || [];

    const since = JalaliUtil.dateToIso(new Date(Date.now() - 60 * 86400000));
    const { data: logs } = await sb.from('cycle_logs').select('*').eq('user_id', State.user.id).gte('log_date', since);
    State.cycleLogs = logs || [];

    if (RelationshipManager.partnerId) {
      const { data: theirs } = await sb.from('cycles').select('*').eq('user_id', RelationshipManager.partnerId)
        .eq('is_shared', true).order('start_date', { ascending: false }).limit(1).maybeSingle();
      State.partnerCycle = theirs || null;
    } else {
      State.partnerCycle = null;
    }
    return State.cycles;
  },

  getCurrent() { return CycleAlgorithms.getCurrent(State.cycles); },
  getStatus() {
    const current = this.getCurrent();
    return current ? CycleAlgorithms.getStatus(current, State.cycles) : null;
  },
  getStats(maxCount) { return CycleAlgorithms.getStats(State.cycles, maxCount); },

  todayLog() {
    const today = JalaliUtil.dateToIso(new Date());
    return State.cycleLogs.find((l) => l.log_date === today) || null;
  },

  async persistRecalculated(cycles) {
    for (const c of cycles) {
      await sb.from('cycles').update({
        cycle_length: c.cycle_length, period_length: c.period_length, updated_at: new Date().toISOString()
      }).eq('id', c.id);
    }
  },

  async startNewPeriod(startDateIso, isShared) {
    const { data: inserted, error } = await sb.from('cycles').insert({
      user_id: State.user.id, start_date: startDateIso, is_shared: !!isShared
    }).select().single();
    if (error) throw error;
    const recalculated = CycleAlgorithms.recalculateAll([...State.cycles, inserted]);
    await this.persistRecalculated(recalculated);
    await ActivityManager.log('cycle');
    await this.loadAll();
    return inserted;
  },

  async correctCycle(id, fields) {
    const { error } = await sb.from('cycles').update({ ...fields, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    const updatedList = State.cycles.map((c) => (c.id === id ? { ...c, ...fields } : c));
    const recalculated = CycleAlgorithms.recalculateAll(updatedList);
    await this.persistRecalculated(recalculated);
    await this.loadAll();
  },

  async deleteCycle(id) {
    const { error } = await sb.from('cycles').delete().eq('id', id);
    if (error) throw error;
    const remaining = State.cycles.filter((c) => c.id !== id);
    const recalculated = CycleAlgorithms.recalculateAll(remaining);
    await this.persistRecalculated(recalculated);
    await this.loadAll();
  },

  async toggleShare(id, isShared) {
    const { error } = await sb.from('cycles').update({ is_shared: isShared }).eq('id', id);
    if (error) throw error;
    await this.loadAll();
  },

  async saveTodayLog(fields) {
    const today = JalaliUtil.dateToIso(new Date());
    const { error } = await sb.from('cycle_logs').upsert(
      { user_id: State.user.id, log_date: today, ...fields },
      { onConflict: 'user_id,log_date' }
    );
    if (error) throw error;
    await ActivityManager.log('cycle');
    await this.loadAll();
  }
};

/* ================================================================
   POMODORO MANAGER
================================================================ */
const PomodoroManager = {
  tick() {
    const p = State.pomodoro;
    if (p.remaining > 0) {
      p.remaining -= 1;
      UIManager.updatePomodoroDisplay();
    } else {
      this.completeSession();
    }
  },

  start() {
    const p = State.pomodoro;
    if (p.running) return;
    p.running = true;
    p.timerId = setInterval(() => this.tick(), 1000);
  },

  pause() {
    const p = State.pomodoro;
    p.running = false;
    clearInterval(p.timerId);
  },

  reset() {
    const p = State.pomodoro;
    this.pause();
    p.remaining = (p.mode === 'focus' ? p.focusMinutes : p.breakMinutes) * 60;
    UIManager.updatePomodoroDisplay();
  },

  skip() {
    this.completeSession(true);
  },

  async completeSession(skipped = false) {
    const p = State.pomodoro;
    this.pause();
    const duration = (p.mode === 'focus' ? p.focusMinutes : p.breakMinutes) * 60 - (skipped ? p.remaining : 0);

    try {
      await sb.from('pomodoro_sessions').insert({
        user_id: State.user.id,
        task_id: p.currentTaskId,
        duration: Math.max(duration, 0),
        session_type: p.mode,
        completed: !skipped,
        started_at: new Date(Date.now() - duration * 1000).toISOString(),
        ended_at: new Date().toISOString()
      });
    } catch (e) { /* non-critical */ }

    if (p.mode === 'focus' && !skipped) {
      p.sessionsCompleted += 1;
      await ActivityManager.log('pomodoro');
      ToastManager.success('یک Session تمرکز تمام شد! وقت استراحته 🍅');
      p.mode = 'break';
    } else if (p.mode === 'break') {
      ToastManager.info('استراحت تمام شد. آماده برای تمرکز بعدی؟');
      p.mode = 'focus';
    } else {
      p.mode = 'break';
    }
    p.remaining = (p.mode === 'focus' ? p.focusMinutes : p.breakMinutes) * 60;
    UIManager.updatePomodoroDisplay();
  }
};

/* ================================================================
   REALTIME MANAGER — بروزرسانی زنده اطلاعات مشترک رابطه
================================================================ */
const RealtimeManager = {
  channel: null,
  subscribeToRelationship() {
    if (!State.relationship || !State.relationship.user2_id) return;
    if (this.channel) sb.removeChannel(this.channel);

    this.channel = sb.channel('relationship-' + State.relationship.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'moods', filter: `relationship_id=eq.${State.relationship.id}` },
        () => { MoodManager.loadHistory().then(() => { if (State.currentView === 'today' || State.currentView === 'relationship') UIManager.renderView(); }); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'memories', filter: `relationship_id=eq.${State.relationship.id}` },
        () => { MemoryManager.loadAll().then(() => { if (State.currentView === 'relationship') UIManager.renderView(); }); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'challenges', filter: `relationship_id=eq.${State.relationship.id}` },
        () => { ChallengeManager.loadAll().then(() => { if (State.currentView === 'relationship') UIManager.renderView(); }); })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'daily_messages', filter: `relationship_id=eq.${State.relationship.id}` },
        (payload) => {
          DailyMessageManager.loadToday().then(() => {
            if (State.currentView === 'relationship') UIManager.renderView();
            const row = payload.new;
            if (row && row.sender_id !== State.user.id) {
              NotificationManager.notifyIfEnabled('پیام جدید از پارتنر 💬', row.content);
            }
          });
        })
      .subscribe();
  }
};

  /* ---------------- MOOD PULSE ---------------- */
  renderMoodPulseCard(compact = false) {
    const days = 14;
    const dates = [];
    for (let i = days - 1; i >= 0; i -= 1) {
      const d = new Date(); d.setDate(d.getDate() - i);
      dates.push(JalaliUtil.dateToIso(d));
    }
    const mine = dates.map((d) => { const m = State.moods.find((x) => x.mood_date === d); return m ? m.mood : null; });
    const theirs = dates.map((d) => { const m = State.partnerMoods.find((x) => x.mood_date === d); return m ? m.mood : null; });

    const mineCount = mine.filter((v) => v !== null).length;
    const theirsCount = theirs.filter((v) => v !== null).length;
    const hasAny = mineCount > 0 || theirsCount > 0;

    const w = 300, h = 110, pad = 14;
    const stepX = (w - pad * 2) / (days - 1);
    const yFor = (v) => h - pad - ((v - 1) / 4) * (h - pad * 2);

    // فقط روزهای واقعاً پشت‌سرهم را با خط وصل کن — روزهای بدون داده نباید
    // با یک خط گمراه‌کننده به دورترین روز بعدی وصل شوند.
    const segmentsFor = (arr) => {
      const segs = []; let cur = [];
      arr.forEach((v, i) => {
        if (v === null) { if (cur.length) segs.push(cur); cur = []; }
        else cur.push([pad + i * stepX, yFor(v)]);
      });
      if (cur.length) segs.push(cur);
      return segs;
    };
    const dotsFor = (arr) => arr.map((v, i) => (v === null ? null : { x: pad + i * stepX, y: yFor(v) })).filter(Boolean);

    const lineSvg = (segs, gradId, dashed) => segs.filter((s) => s.length > 1).map((seg) => {
      const pts = seg.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
      return `<polyline points="${pts}" fill="none" stroke="url(#${gradId})" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" ${dashed ? 'stroke-dasharray="4 3"' : ''} />`;
    }).join('');
    const dotSvg = (dots, color) => dots.map((d) => `<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="3.2" fill="${color}" />`).join('');

    const firstLabel = JalaliUtil.formatShort(JalaliUtil.isoToDate(dates[0]));
    const lastLabel = JalaliUtil.formatShort(JalaliUtil.isoToDate(dates[dates.length - 1]));

    const svg = hasAny ? `
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">
        <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--border-soft)" stroke-width="1" />
        <text x="${pad}" y="12" font-size="9" fill="var(--text-muted)">😍</text>
        <text x="${pad}" y="${h - 2}" font-size="9" fill="var(--text-muted)">😞</text>
        ${lineSvg(segmentsFor(mine), 'ringGrad', false)}
        ${lineSvg(segmentsFor(theirs), 'ringGradRose', true)}
        ${dotSvg(dotsFor(mine), 'var(--accent-2)')}
        ${dotSvg(dotsFor(theirs), 'var(--rose-2)')}
      </svg>
      <div class="row between tiny faint" style="margin-top:2px;"><span>${firstLabel}</span><span>${lastLabel}</span></div>
      ${(mineCount < 3 && theirsCount < 3) ? `<div class="tiny faint" style="margin-top:6px;">برای دیدن یک روند واضح‌تر، چند روز دیگر هم Mood ثبت کنید.</div>` : ''}
    ` : `<div class="empty-state small"><span class="emoji">📈</span>هنوز داده‌ای برای نمودار نیست</div>`;

    return `
      <div class="card">
        <div class="row between" style="margin-bottom:8px;">
          <div style="font-weight:800;">❤️ Relationship Pulse</div>
          <div class="tiny faint">۱۴ روز اخیر</div>
        </div>
        ${svg}
        ${hasAny ? `<div class="row gap-16 tiny faint" style="margin-top:8px;">
          <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-2);margin-left:4px;"></span>شما</span>
          ${RelationshipManager.partnerId ? `<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rose-2);margin-left:4px;"></span>پارتنر</span>` : ''}
        </div>` : ''}
      </div>
    `;
  },

UIManager.classifyCycleDate = function (iso, status) {
  const today = JalaliUtil.dateToIso(new Date());
  for (const c of State.cycles) {
    const s = c.start_date;
    const e = c.end_date || addDaysIso(s, (c.period_length || status.periodLen) - 1);
    if (iso >= s && iso <= e) return 'period';
  }
  const nextEnd = addDaysIso(status.nextPeriodDate, status.periodLen - 1);
  if (iso >= status.nextPeriodDate && iso <= nextEnd) return 'period-estimate';
  if (iso >= status.ovulationStart && iso <= status.ovulationEnd) return 'ovulation';
  if (iso === today) return 'today';
  return null;
};

UIManager.cycleDonutSvg = function (status) {
  const { cycleLen, effectiveDay, periodLen } = status;
  const size = 176, r = 70, cx = size / 2, cy = size / 2, thickness = 15;
  const phases = [];
  for (let d = 1; d <= cycleLen; d += 1) phases.push(CycleAlgorithms.getPhase(d, cycleLen, periodLen));
  const arcs = [];
  let segStart = 0;
  for (let i = 1; i <= phases.length; i += 1) {
    if (i === phases.length || phases[i] !== phases[segStart]) { arcs.push({ phase: phases[segStart], from: segStart, to: i }); segStart = i; }
  }
  const toXY = (frac) => {
    const angle = frac * 2 * Math.PI - Math.PI / 2;
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  };
  const arcPaths = arcs.map((a) => {
    const fromFrac = a.from / cycleLen, toFrac = a.to / cycleLen;
    const [x1, y1] = toXY(fromFrac), [x2, y2] = toXY(Math.min(toFrac, 0.9999));
    const largeArc = (toFrac - fromFrac) > 0.5 ? 1 : 0;
    const color = CycleAlgorithms.PHASE_META[a.phase].color;
    return `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${thickness}" />`;
  }).join('');
  const [mx, my] = toXY((effectiveDay - 0.5) / cycleLen);
  return `
    <svg viewBox="0 0 ${size} ${size}" style="width:168px;height:168px;">
      ${arcPaths}
      <circle cx="${mx.toFixed(2)}" cy="${my.toFixed(2)}" r="7" fill="var(--bg-elevated)" stroke="#fff" stroke-width="2.5" />
      <text x="${cx}" y="${cy - 3}" text-anchor="middle" font-size="24" font-weight="800" fill="var(--text-primary)">${Digits.toFa(effectiveDay)}</text>
      <text x="${cx}" y="${cy + 17}" text-anchor="middle" font-size="10" fill="var(--text-muted)">از ${Digits.toFa(cycleLen)} روز</text>
    </svg>
  `;
};

UIManager.cycleCalendarHtml = function (status) {
  const now = new Date();
  const j = JalaliUtil.fromDate(now);
  const monthLen = jalaliMonthLength(j.jy, j.jm);
  const firstDate = JalaliUtil.toDate(j.jy, j.jm, 1);
  const firstWeekday = firstDate.getDay();
  const cells = [];
  for (let i = 0; i < firstWeekday; i += 1) cells.push(null);
  for (let d = 1; d <= monthLen; d += 1) {
    const iso = JalaliUtil.dateToIso(JalaliUtil.toDate(j.jy, j.jm, d));
    cells.push({ day: d, cls: this.classifyCycleDate(iso, status) });
  }
  const styles = {
    period: 'background:var(--danger);color:#fff;',
    'period-estimate': 'border:2px dashed var(--danger);color:var(--danger);',
    ovulation: 'background:var(--warning);color:#241C11;',
    today: 'border:2px solid var(--accent);color:var(--accent-2);font-weight:800;'
  };
  const dayCell = (c) => !c ? `<div></div>` : `<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:11.5px;${styles[c.cls] || ''}">${Digits.toFa(c.day)}</div>`;
  return `
    <div style="text-align:center;font-weight:700;margin-bottom:8px;">${JalaliUtil.MONTHS[j.jm - 1]} ${Digits.toFa(j.jy)}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:10px;color:var(--text-muted);text-align:center;margin-bottom:4px;">
      ${JalaliUtil.WEEKDAYS_SHORT.map((w) => `<div>${w}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;">${cells.map(dayCell).join('')}</div>
    <div class="row gap-12 tiny faint" style="margin-top:10px;flex-wrap:wrap;">
      <span>🔴 روزهای پریود</span><span>🟡 بازه تخمینی تخمک‌گذاری</span><span>⭕ تخمین پریود بعدی</span>
    </div>
  `;
};

UIManager.openPomodoro = function (taskId) {
  const p = State.pomodoro;
  if (taskId) p.currentTaskId = taskId;
  ModalManager.open(`
    <div class="modal-title">🍅 Pomodoro</div>
    <div class="pomo-wrap">
      <div class="pomo-ring">
        <svg viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="100" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
          <circle id="pomo-circle" cx="110" cy="110" r="100" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="628.3" stroke-dashoffset="0"/>
        </svg>
        <div class="pomo-time">
          <div class="t num" id="pomo-time-text">۲۵:۰۰</div>
          <div class="m" id="pomo-mode-text">${p.mode === 'focus' ? 'تمرکز' : 'استراحت'}</div>
        </div>
      </div>
      <div class="pomo-controls">
        <button class="btn btn-icon" data-action="pomo-reset" aria-label="ریست"><i data-lucide="rotate-ccw"></i></button>
        <button class="btn btn-primary" style="width:96px;" data-action="pomo-toggle" id="pomo-toggle-btn">${p.running ? 'مکث' : 'شروع'}</button>
        <button class="btn btn-icon" data-action="pomo-skip" aria-label="رد کردن"><i data-lucide="skip-forward"></i></button>
      </div>
      <div class="tiny faint section-gap">${Digits.toFa(p.sessionsCompleted)} Session تکمیل‌شده</div>
    </div>
  `);
  this.updatePomodoroDisplay();
};

UIManager.updatePomodoroDisplay = function () {
  const p = State.pomodoro;
  const totalSec = (p.mode === 'focus' ? p.focusMinutes : p.breakMinutes) * 60;
  const timeText = qs('#pomo-time-text');
  if (!timeText) return;
  const mins = Math.floor(p.remaining / 60);
  const secs = p.remaining % 60;
  timeText.textContent = Digits.toFa(`${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`);
  const modeText = qs('#pomo-mode-text');
  if (modeText) modeText.textContent = p.mode === 'focus' ? 'تمرکز' : 'استراحت';
  const circle = qs('#pomo-circle');
  if (circle) {
    const circumference = 2 * Math.PI * 100;
    const pct = totalSec ? p.remaining / totalSec : 0;
    circle.setAttribute('stroke-dashoffset', String(circumference * (1 - pct)));
  }
  const btn = qs('#pomo-toggle-btn');
  if (btn) btn.textContent = p.running ? 'مکث' : 'شروع';
};

function confirmModal(message, onConfirm) {
  ModalManager.open(`
    <div class="modal-title">تأیید حذف</div>
    <p class="muted small" style="margin-bottom:20px;">${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" data-action="close-modal">انصراف</button>
      <button class="btn btn-danger btn-block" id="confirm-yes-btn">حذف</button>
    </div>
  `);
  qs('#confirm-yes-btn').addEventListener('click', async () => {
    ModalManager.close();
    await onConfirm();
  });
}

/* ================================================================
   APP — bootstrap + event delegation
================================================================ */
const App = {
  async bootAuthenticated() {
    Loading.show();
    try {
      await ProfileManager.load();
      await RelationshipManager.load();
      await Promise.all([
        TaskManager.loadAll(),
        GoalManager.loadAll(),
        MoodManager.loadHistory(),
        ActivityManager.loadStreak(),
        CycleManager.loadAll()
      ]);
      await Promise.all([MemoryManager.loadAll(), ChallengeManager.loadAll(), DailyMessageManager.loadToday()]);
      RealtimeManager.subscribeToRelationship();
      if (State.localPrefs.notifications && NotificationManager.hasPermission()) {
        NotificationManager.startChecking();
      }
      this.showApp();
      UIManager.navigate('today');
    } catch (e) {
      ToastManager.error(friendlyError(e));
    } finally {
      Loading.hide();
    }
  },

  showApp() {
    qs('#auth-screen').style.display = 'none';
    qs('#app-root').classList.add('ready');
  },

  showAuthScreen() {
    qs('#app-root').classList.remove('ready');
    qs('#auth-screen').style.display = 'flex';
  },

  showConfigWarning() {
    if (qs('#config-warning')) return;
    const box = el(`
      <div id="config-warning" class="auth-error" style="display:block;margin-bottom:16px;">
        ⚠️ کلیدهای Supabase هنوز تنظیم نشده‌اند. فرم‌های زیر تا وارد کردن SUPABASE_URL و SUPABASE_ANON_KEY در انتهای index.html کار نخواهند کرد (به README.md نگاه کنید).
      </div>
    `);
    qs('.auth-box').insertBefore(box, qs('.auth-tabs'));
  },

  async withLoading(fn) {
    Loading.show();
    try { await fn(); } catch (e) { ToastManager.error(friendlyError(e)); } finally { Loading.hide(); }
  },

  bindEvents() {
    // ---------- Auth tabs ----------
    qsa('[data-authtab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.authtab;
        qsa('.auth-tab').forEach((t) => t.classList.toggle('active', t.dataset.authtab === tab));
        qsa('[data-authform]').forEach((f) => { f.style.display = f.dataset.authform === tab ? 'block' : 'none'; });
        qs('#auth-error').style.display = 'none';
      });
    });

    qs('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      Loading.show();
      try {
        await AuthManager.signIn(fd.get('email'), fd.get('password'));
        await App.bootAuthenticated();
      } catch (err) {
        qs('#auth-error').textContent = friendlyError(err);
        qs('#auth-error').style.display = 'block';
      } finally { Loading.hide(); }
    });

    qs('#register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      Loading.show();
      try {
        await AuthManager.signUp(fd.get('full_name'), fd.get('email'), fd.get('password'));
        ToastManager.success('ثبت‌نام موفق بود! اگر تأیید ایمیل فعال باشد، ایمیلت را بررسی کن.');
        const { data } = await sb.auth.getSession();
        if (data.session) { State.session = data.session; State.user = data.session.user; await App.bootAuthenticated(); }
      } catch (err) {
        qs('#auth-error').textContent = friendlyError(err);
        qs('#auth-error').style.display = 'block';
      } finally { Loading.hide(); }
    });

    qs('#forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      Loading.show();
      try {
        await AuthManager.resetPassword(fd.get('email'));
        ToastManager.success('لینک بازیابی ارسال شد ✓');
      } catch (err) {
        qs('#auth-error').textContent = friendlyError(err);
        qs('#auth-error').style.display = 'block';
      } finally { Loading.hide(); }
    });

    // ---------- Nav ----------
    document.addEventListener('click', (e) => {
      const navBtn = e.target.closest('[data-nav]');
      if (navBtn) { UIManager.navigate(navBtn.dataset.nav); }
    });

    // ---------- Delegated actions ----------
    document.addEventListener('click', async (e) => {
      const t = e.target.closest('[data-action]');
      if (!t) return;
      const action = t.dataset.action;
      const id = t.dataset.id;

      switch (action) {
        case 'close-modal': ModalManager.close(); break;

        case 'open-task-modal': UIManager.openTaskModal(id); break;
        case 'toggle-task':
          await TaskManager.toggleComplete(id); UIManager.renderView(); break;
        case 'delete-task':
          confirmModal('این تسک برای همیشه حذف می‌شود.', async () => {
            await App.withLoading(async () => { await TaskManager.deleteTask(id); UIManager.renderView(); ToastManager.success('حذف شد ✓'); });
          }); break;
        case 'delete-task-modal':
          confirmModal('این تسک برای همیشه حذف می‌شود.', async () => {
            await App.withLoading(async () => { await TaskManager.deleteTask(id); UIManager.renderView(); ToastManager.success('حذف شد ✓'); });
          }); break;
        case 'set-task-filter': State.taskFilter = t.dataset.value; UIManager.renderView(); break;
        case 'set-tag-filter': State.taskTagFilter = t.dataset.value || null; UIManager.renderView(); break;
        case 'select-date':
          State.selectedDate = t.dataset.value;
          State.taskFilter = 'customDate';
          UIManager.renderView(); break;

        case 'open-goal-modal': UIManager.openGoalModal(id); break;
        case 'delete-goal':
          confirmModal('این هدف برای همیشه حذف می‌شود.', async () => {
            await App.withLoading(async () => { await GoalManager.deleteGoal(id); UIManager.renderView(); ToastManager.success('حذف شد ✓'); });
          }); break;
        case 'delete-goal-modal':
          confirmModal('این هدف برای همیشه حذف می‌شود.', async () => {
            await App.withLoading(async () => { await GoalManager.deleteGoal(id); UIManager.renderView(); ToastManager.success('حذف شد ✓'); });
          }); break;
        case 'toggle-step':
          await TaskOrGoalStepToggle(id, t.dataset.goal); break;
        case 'set-goal-horizon': State.goalHorizonFilter = t.dataset.value; UIManager.renderView(); break;

        case 'open-mood-modal': UIManager.openMoodModal(); break;
        case 'pick-mood':
          qsa('.mood-opt').forEach((o) => o.classList.toggle('selected', o === t));
          break;
        case 'submit-mood': {
          const selected = qs('.mood-opt.selected');
          if (!selected) { ToastManager.warning('یک حالت را انتخاب کن.'); return; }
          const mood = Number(selected.dataset.value);
          const note = qs('#mood-note').value;
          const shared = qs('#mood-shared').checked;
          await App.withLoading(async () => {
            await MoodManager.upsert(mood, note, shared);
            ModalManager.close(); UIManager.renderView();
            ToastManager.success('با موفقیت ذخیره شد ✓');
          });
          break;
        }

        case 'open-memory-modal': UIManager.openMemoryModal(); break;
        case 'delete-memory':
          confirmModal('این خاطره برای همیشه حذف می‌شود.', async () => {
            await App.withLoading(async () => { await MemoryManager.delete(id); UIManager.renderView(); ToastManager.success('حذف شد ✓'); });
          }); break;

        case 'open-challenge-modal': UIManager.openChallengeModal(); break;
        case 'increment-challenge':
          await App.withLoading(async () => { await ChallengeManager.increment(id); UIManager.renderView(); });
          break;
        case 'delete-challenge':
          confirmModal('این چالش برای همیشه حذف می‌شود.', async () => {
            await App.withLoading(async () => { await ChallengeManager.delete(id); UIManager.renderView(); ToastManager.success('حذف شد ✓'); });
          }); break;

        case 'open-cycle-modal': UIManager.openCycleModal(); break;
        case 'confirm-new-period': UIManager.openConfirmNewPeriod(); break;
        case 'submit-new-period': {
          const dateIso = qs('#new-period-date').value;
          const shared = qs('#new-period-shared').checked;
          if (!dateIso) { ToastManager.warning('تاریخ را وارد کن.'); return; }
          await App.withLoading(async () => {
            await CycleManager.startNewPeriod(dateIso, shared);
            ModalManager.close();
            UIManager.openCycleModal();
            ToastManager.success('چرخه جدید ثبت و کل چرخه دوباره محاسبه شد ✓');
          });
          break;
        }
        case 'open-cycle-correct': UIManager.openCycleEditModal(id); break;
        case 'delete-cycle':
          confirmModal('این چرخه از تاریخچه حذف می‌شود و محاسبات دوباره انجام می‌شود.', async () => {
            await App.withLoading(async () => {
              await CycleManager.deleteCycle(id);
              ModalManager.close();
              UIManager.openCycleModal();
              ToastManager.success('حذف و محاسبه مجدد انجام شد ✓');
            });
          }); break;

        case 'open-pomodoro': UIManager.openPomodoro(); break;
        case 'pomo-toggle':
          if (State.pomodoro.running) PomodoroManager.pause(); else PomodoroManager.start();
          UIManager.updatePomodoroDisplay(); break;
        case 'pomo-reset': PomodoroManager.reset(); break;
        case 'pomo-skip': PomodoroManager.skip(); break;

        case 'create-invite':
          await App.withLoading(async () => { await RelationshipManager.createInvite(); UIManager.renderView(); ToastManager.success('کد دعوت ساخته شد ✓'); });
